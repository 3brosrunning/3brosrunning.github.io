<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legacy Board | Texas Bridge Series</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Favicon & Open Graph Meta -->
  <link rel="shortcut icon" href="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" type="image/png">
  <link rel="icon" href="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" type="image/png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Texas Bridge Series Legacy Board">
  <meta property="og:description" content="Check out my race history across the toughest bridges in Texas! Join the tradition at 3brosrunning.com.">
  <meta property="og:url" content="https://www.ticketsignup.io/w/TexasBridgeSeries">
  <meta property="og:image" content="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --tbs-orange: #ff5722;
      --tbs-amber: #ff9800;
      --tbs-dark: #212121;
      --gold: #FFD700;
      --gold-bg: #fffdf0;
      --tier-20: #faf5ff;
      --tier-15: #fff0f5;
      --tier-10: #fff8e1;
      --tier-5: #f0f7ff;
      --bg-color: #f7f8fa;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Roboto", sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: #333;
      overflow-y: scroll;
    }

    /* Sticky Navigation Header */
    .header-nav {
      background: #ffffff;
      padding: 12px 25px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .header-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 12px;
    }
    .header-logo { height: 42px; width: auto; object-fit: contain; }
    .site-title {
      font-weight: 900;
      color: var(--tbs-orange);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-size: 1.15rem;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, #ff5722 0%, #ff9800 100%);
      color: white;
      padding: 55px 20px 75px;
      text-align: center;
      border-bottom: 4px solid #e64a19;
    }
    .hero-banner h1 {
      font-size: 2.6rem;
      margin: 0 0 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-banner p {
      font-size: 1.15rem;
      margin: 0 auto;
      max-width: 680px;
      opacity: 0.95;
      line-height: 1.5;
    }

    /* Container & Toolbar */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }
    .toolbar {
      background: white;
      padding: 28px 25px;
      border-radius: 14px;
      margin-top: -45px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
      z-index: 10;
    }
    #runnerSearch {
      width: 100%;
      max-width: 520px;
      padding: 14px 22px;
      border-radius: 50px;
      border: 2px solid #e5e7eb;
      font-size: 1rem;
      margin-bottom: 22px;
      outline: none;
      transition: all 0.2s ease;
    }
    #runnerSearch:focus {
      border-color: var(--tbs-orange);
      box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.15);
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .filter-btn {
      padding: 10px 18px;
      border: 1.5px solid #e2e8f0;
      border-radius: 30px;
      background: #f8fafc;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #475569;
      transition: all 0.2s ease;
    }
    .filter-btn:hover { background: #e2e8f0; }
    .filter-btn.active {
      background: var(--tbs-orange);
      color: white;
      border-color: var(--tbs-orange);
      box-shadow: 0 3px 10px rgba(255, 87, 34, 0.3);
    }

    /* Card Grid */
    #runnerList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      margin: 40px 0;
      min-height: 400px;
    }
    .runner-card {
      background: white;
      border-radius: 14px;
      padding: 42px 22px 24px;
      text-align: center;
      position: relative;
      border: 1px solid #eef0f2;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .runner-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.09);
    }

    /* Badges & Tiers */
    .badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 14px;
      font-size: 0.72rem;
      font-weight: 900;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .badge-gold { background: var(--gold); color: #111; }
    .badge-perfect { background: #2e7d32; color: #fff; }
    .badge-standard { background: #334155; color: #fff; }

    .tier-gold { background: var(--gold-bg) !important; border: 2.5px solid var(--gold) !important; }
    .tier-perfect { border: 2.5px solid #2e7d32 !important; }
    .tier-20 { background: var(--tier-20); border-top: 5px solid #9c27b0; }
    .tier-15 { background: var(--tier-15); border-top: 5px solid #d81b60; }
    .tier-10 { background: var(--tier-10); border-top: 5px solid var(--tbs-amber); }
    .tier-5  { background: var(--tier-5); border-top: 5px solid #0288d1; }

    .runner-name {
      font-weight: 900;
      font-size: 1.35rem;
      color: #1e293b;
      margin: 0 0 6px;
    }
    .main-stat {
      font-size: 2.4rem;
      font-weight: 900;
      color: var(--tbs-orange);
      line-height: 1.1;
      margin: 8px 0 4px;
    }
    .sub-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .lifetime-stat {
      font-size: 0.76rem;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 14px;
    }
    .history-box {
      text-align: left;
      background: rgba(248, 250, 252, 0.9);
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 0.82rem;
      max-height: 140px;
      overflow-y: auto;
      flex-grow: 1;
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .history-item {
      padding: 3px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      color: #334155;
    }
    .history-item:last-child { border-bottom: none; }

    /* Share Button */
    .share-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .share-btn:hover { background: #f1f5f9; border-color: #94a3b8; }
    .share-icon { width: 14px; height: 14px; }

    /* Floating CTA */
    .floating-cta {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--tbs-orange);
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 900;
      z-index: 2000;
      border: 2px solid #fff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.22);
      transition: transform 0.2s, background 0.2s;
    }
    .floating-cta:hover {
      background: #e64a19;
      transform: scale(1.04);
    }

    #sentinel { height: 40px; width: 100%; }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="https://www.ticketsignup.io/w/TexasBridgeSeries" class="header-link">
      <img src="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" class="header-logo" alt="Bridge Series Logo">
      <span class="site-title">Texas Bridge Series Legacy</span>
    </a>
  </header>

  <section class="hero-banner">
    <h1>Legacy Runners</h1>
    <p>Conquering the Toughest Bridges in Texas: Kemah 10K, Galveston 10K, and La Porte Half Marathon.</p>
  </section>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="runnerSearch" placeholder="Search for a legend by name...">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="Series">Texas Bridge Series</button>
        <button class="filter-btn" data-filter="Kemah">Toughest 10K Kemah</button>
        <button class="filter-btn" data-filter="Galveston">Toughest 10K Galveston</button>
        <button class="filter-btn" data-filter="LaPorte">La Porte By the Bay Half</button>
      </div>
    </div>

    <div id="runnerList"></div>
    <div id="sentinel"></div>
  </main>

  <a href="https://www.ticketsignup.io/w/TexasBridgeSeries" class="floating-cta" target="_blank">Register Now</a>

  <script>
    let rawRunnersMap = {};
    let allRunners = [];
    let filteredRunners = [];
    let currentFilter = 'Series';
    let searchTerm = '';
    let maxVal = 0;
    const batchSize = 50;

    // Track historical totals to establish "Completed Every Year" status
    const historicalPossible = {
      Series: 0,
      Kemah: 0,
      Galveston: 0,
      LaPorte: 0
    };

    const listElement = document.getElementById("runnerList");

    function createCardHTML(r) {
      let tClass = "", bText = "", bClass = "badge-standard";
      const totalPossible = historicalPossible[currentFilter] || 0;

      // 1. Loyalty Tier Assignments
      if (r.cVal >= 20) { tClass = "tier-20"; bText = "Series Immortal"; }
      else if (r.cVal >= 15) { tClass = "tier-15"; bText = "Series Elite"; }
      else if (r.cVal >= 10) { tClass = "tier-10"; bText = "Series Veteran"; }
      else if (r.cVal >= 5)  { tClass = "tier-5";  bText = "Series Faithful"; }
      else { bText = "Bridge Runner"; }

      // 2. Completed every race since inception
      if (totalPossible > 0 && r.cVal === totalPossible) {
        tClass = "tier-perfect";
        bClass = "badge-perfect";
        bText = "Perfect Record";
      }

      // 3. Overall Top Leader(s)
      if (r.cVal === maxVal && maxVal > 0) {
        tClass = "tier-gold";
        bClass = "badge-gold";
        bText = currentFilter === 'Series' ? "All-Time Series Leader" : `${currentFilter} Leader`;
      }

      // Format History List
      let historyItems = [];
      if (currentFilter === 'Series') {
        historyItems = r.seriesYears.map(yr => `<div class="history-item">🏁 <strong>${yr}</strong>: Full Series Completed (Kemah, Galveston, La Porte)</div>`);
      } else {
        const targetEventKey = currentFilter === 'Kemah' ? 'Kemah 10k' : (currentFilter === 'Galveston' ? 'Galveston 10k' : 'La Porte Half');
        historyItems = r.raceEntries
          .filter(entry => entry.event === targetEventKey)
          .map(entry => `<div class="history-item">🏅 <strong>${entry.year}</strong>: ${entry.event} Finisher</div>`);
      }

      return `
        <div class="runner-card ${tClass}" id="runner-${r.displayName.replace(/[^a-zA-Z0-9]/g, '-')}">
          <div class="badge ${bClass}">${bText}</div>
          <div class="runner-name">${r.displayName}</div>
          <div class="main-stat">${r.cVal}</div>
          <div class="sub-label">${r.cLabel}</div>
          <div class="lifetime-stat">Lifetime Bridge Finishes: ${r.totalFinishes}</div>
          <div class="history-box">${historyItems.join('')}</div>
          <button class="share-btn" onclick="shareRunner('${r.displayName.replace(/'/g, "\\'")}')">
            <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Share My Legacy
          </button>
        </div>
      `;
    }

    function processAndFilter() {
      filteredRunners = allRunners.map(r => {
        let val = 0;
        let label = "";

        if (currentFilter === 'Series') {
          val = r.seriesCount;
          label = val === 1 ? "Series Completed" : "Series Completed";
        } else if (currentFilter === 'Kemah') {
          val = r.kemahCount;
          label = val === 1 ? "Kemah Finish" : "Kemah Finishes";
        } else if (currentFilter === 'Galveston') {
          val = r.galvestonCount;
          label = val === 1 ? "Galveston Finish" : "Galveston Finishes";
        } else if (currentFilter === 'LaPorte') {
          val = r.laporteCount;
          label = val === 1 ? "La Porte Finish" : "La Porte Finishes";
        }

        return { ...r, cVal: val, cLabel: label };
      }).filter(r => r.displayName.toLowerCase().includes(searchTerm.toLowerCase()) && r.cVal > 0);

      filteredRunners.sort((a, b) => b.cVal - a.cVal || a.displayName.localeCompare(b.displayName));
      maxVal = filteredRunners.length > 0 ? filteredRunners[0].cVal : 0;

      renderList(true);
    }

    function renderList(reset = false) {
      if (reset) listElement.innerHTML = "";
      const start = listElement.children.length;
      const nextBatch = filteredRunners.slice(start, start + batchSize);

      if (reset && nextBatch.length === 0) {
        listElement.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #64748b; font-size: 1.1rem; padding: 40px 0;">No matching runners found.</p>`;
        return;
      }

      const htmlString = nextBatch.map(r => createCardHTML(r)).join('');
      listElement.insertAdjacentHTML('beforeend', htmlString);
    }

    // Infinite Scroll
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && listElement.children.length < filteredRunners.length) {
        renderList();
      }
    }, { threshold: 0.1 });
    observer.observe(document.getElementById('sentinel'));

    // Debounced Search Input
    let searchTimeout;
    document.getElementById("runnerSearch").addEventListener("input", function() {
      clearTimeout(searchTimeout);
      searchTerm = this.value.trim();
      searchTimeout = setTimeout(processAndFilter, 250);
    });

    // Category Filter Selection
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentFilter = this.getAttribute("data-filter");
        processAndFilter();
      });
    });

    // Share & Deep-Link Functionality
    function shareRunner(name) {
      const url = new URL(window.location.href);
      url.searchParams.set('runner', name);
      const shareTitle = "Texas Bridge Series Legacy";
      const shareText = `Check out ${name}'s race legacy in the Texas Bridge Series! View stats:`;

      if (navigator.share) {
        navigator.share({ title: shareTitle, text: shareText, url: url.toString() }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url.toString()).then(() => {
          alert(`Link to ${name}'s legacy card copied to clipboard!`);
        });
      }
    }

    // Ingest and Parse Data
    Papa.parse("tbs_master_list.csv?v=" + new Date().getTime(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim().replace(/^\uFEFF/, ''),
      complete: function(results) {
        let runnersObj = {};
        let seriesYearsSet = new Set();
        let kemahYearsSet = new Set();
        let galvYearsSet = new Set();
        let laporteYearsSet = new Set();

        results.data.forEach(row => {
          const year = (row['Year'] || "").trim();
          const fName = (row['First Name'] || "").trim();
          const lName = (row['Last Name'] || "").trim();
          const event = (row['Event'] || "").trim();

          if (!year || !fName || !lName || !event) return;

          // Standardize key and clean display formatting
          const key = `${fName.toLowerCase()} ${lName.toLowerCase()}`;
          const formattedName = `${fName.charAt(0).toUpperCase() + fName.slice(1).toLowerCase()} ${lName.charAt(0).toUpperCase() + lName.slice(1).toLowerCase()}`;

          if (!runnersObj[key]) {
            runnersObj[key] = {
              displayName: formattedName,
              eventsByYear: {},
              raceEntries: [],
              totalFinishes: 0
            };
          }

          if (!runnersObj[key].eventsByYear[year]) {
            runnersObj[key].eventsByYear[year] = new Set();
          }

          runnersObj[key].eventsByYear[year].add(event);
          runnersObj[key].raceEntries.push({ year: parseInt(year), event: event });
          runnersObj[key].totalFinishes += 1;

          // Track dataset coverage
          if (event === 'Kemah 10k') kemahYearsSet.add(year);
          if (event === 'Galveston 10k') galvYearsSet.add(year);
          if (event === 'La Porte Half') laporteYearsSet.add(year);
        });

        // Compute possible series years across the history
        kemahYearsSet.forEach(yr => {
          if (galvYearsSet.has(yr) && laporteYearsSet.has(yr)) {
            seriesYearsSet.add(yr);
          }
        });

        historicalPossible.Series = seriesYearsSet.size;
        historicalPossible.Kemah = kemahYearsSet.size;
        historicalPossible.Galveston = galvYearsSet.size;
        historicalPossible.LaPorte = laporteYearsSet.size;

        allRunners = Object.values(runnersObj).map(r => {
          let seriesYears = [];
          let kemahCount = 0;
          let galvestonCount = 0;
          let laporteCount = 0;

          for (const [yr, events] of Object.entries(r.eventsByYear)) {
            // Full Bridge Series completion requirement: all 3 events in same calendar year
            if (events.has('Kemah 10k') && events.has('Galveston 10k') && events.has('La Porte Half')) {
              seriesYears.push(parseInt(yr));
            }
            if (events.has('Kemah 10k')) kemahCount++;
            if (events.has('Galveston 10k')) galvestonCount++;
            if (events.has('La Porte Half')) laporteCount++;
          }

          // Sort race history descending by year
          r.raceEntries.sort((a, b) => b.year - a.year);
          seriesYears.sort((a, b) => b - a);

          return {
            displayName: r.displayName,
            totalFinishes: r.totalFinishes,
            seriesCount: seriesYears.length,
            seriesYears: seriesYears,
            kemahCount: kemahCount,
            galvestonCount: galvestonCount,
            laporteCount: laporteCount,
            raceEntries: r.raceEntries
          };
        });

        // Check for URL ?runner= query deep-link
        const urlParams = new URLSearchParams(window.location.search);
        const rParam = urlParams.get('runner');
        if (rParam) {
          document.getElementById('runnerSearch').value = rParam;
          searchTerm = rParam;
        }

        processAndFilter();
      },
      error: function(err) {
        listElement.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: red;">Error loading legacy data.</p>`;
        console.error(err);
      }
    });
  </script>
</body>
</html>
