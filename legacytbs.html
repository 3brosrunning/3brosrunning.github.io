<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legacy Board | Texas Bridge Series</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <!-- Favicon & Open Graph Meta -->
  <link rel="shortcut icon" href="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" type="image/png">
  <link rel="icon" href="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" type="image/png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Texas Bridge Series Legacy Board">
  <meta property="og:description" content="Check out my race history across the toughest bridges in Texas! Join the tradition at 3brosrunning.com.">
  <meta property="og:url" content="https://www.ticketsignup.io/w/TexasBridgeSeries">
  <meta property="og:image" content="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      /* Brand Palette */
      --tbs-blue: #0167b4;
      --tbs-blue-dark: #014c85;
      --tbs-star-blue: #bae2fa;
      --tbs-charcoal: #3f3e3d;
      --page-bg: #f4f7fa;

      /* Gold / Leader Accents */
      --gold: #FFD700;
      --gold-dark: #b8860b;
      --gold-bg: #fffdf2;

      /* Milestone Colors */
      --tier-20-bg: #fdf2f8;
      --tier-20-border: #db2777;
      --tier-20-text: #9d174d;

      --tier-15-bg: #f5f3ff;
      --tier-15-border: #7c3aed;
      --tier-15-text: #5b21b6;

      --tier-10-bg: #e0f2fe;
      --tier-10-border: #0284c7;
      --tier-10-text: #0369a1;

      --tier-5-bg: #ecfdf5;
      --tier-5-border: #059669;
      --tier-5-text: #047857;

      --tier-standard-bg: #ffffff;
      --tier-standard-border: #e2edf6;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Roboto", sans-serif;
      margin: 0;
      background-color: var(--page-bg);
      color: #2b2b2b;
      overflow-y: scroll;
    }

    /* Sticky Header */
    .header-nav {
      background: #ffffff;
      padding: 12px 25px;
      border-bottom: 2px solid var(--tbs-star-blue);
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 10px rgba(1, 103, 180, 0.08);
    }
    .header-link {
      display: flex;
      align-items: center;
      text-decoration: none;
      gap: 12px;
    }
    .header-logo { height: 44px; width: auto; object-fit: contain; }
    .site-title {
      font-weight: 900;
      color: var(--tbs-blue);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-size: 1.15rem;
    }

    /* Hero Banner */
    .hero-banner {
      background: linear-gradient(135deg, var(--tbs-blue-dark) 0%, var(--tbs-blue) 60%, #0288d1 100%);
      color: white;
      padding: 55px 20px 80px;
      text-align: center;
      border-bottom: 4px solid var(--tbs-star-blue);
    }
    .hero-banner h1 {
      font-size: 2.6rem;
      margin: 0 0 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-banner p {
      font-size: 1.12rem;
      margin: 0 auto;
      max-width: 700px;
      color: #e3f2fd;
      line-height: 1.5;
    }

    /* Controls & Toolbar */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }
    .toolbar {
      background: white;
      padding: 28px 25px;
      border-radius: 14px;
      margin-top: -45px;
      box-shadow: 0 8px 24px rgba(1, 103, 180, 0.1);
      border: 1px solid #e1ecf4;
      text-align: center;
      position: relative;
      z-index: 10;
    }
    #runnerSearch {
      width: 100%;
      max-width: 520px;
      padding: 14px 22px;
      border-radius: 50px;
      border: 2px solid #d4e3ee;
      font-size: 1rem;
      margin-bottom: 22px;
      outline: none;
      transition: all 0.2s ease;
      background: #fafcfe;
    }
    #runnerSearch:focus {
      border-color: var(--tbs-blue);
      box-shadow: 0 0 0 4px rgba(1, 103, 180, 0.16);
      background: #ffffff;
    }
    .filter-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .filter-btn {
      padding: 10px 20px;
      border: 1.5px solid #d2e3f0;
      border-radius: 30px;
      background: #f4f9fd;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--tbs-charcoal);
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      background: #e1f0fa;
      border-color: #bcd8ed;
    }
    .filter-btn.active {
      background: var(--tbs-blue);
      color: #ffffff;
      border-color: var(--tbs-blue);
      box-shadow: 0 4px 12px rgba(1, 103, 180, 0.3);
    }

    /* Legend Bar */
    .legend-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #555;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .legend-color {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }

    /* Grid Layout */
    #runnerList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      margin: 40px 0;
      min-height: 400px;
    }

    /* Base Card Styling */
    .runner-card {
      border-radius: 14px;
      padding: 44px 22px 24px;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      background: var(--tier-standard-bg);
      border: 1.5px solid var(--tier-standard-border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .runner-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.1);
    }

    /* Distinct Tier Color Themes */
    .runner-card.tier-5 {
      background: var(--tier-5-bg);
      border: 2px solid var(--tier-5-border);
    }
    .runner-card.tier-5 .main-stat { color: var(--tier-5-text); }
    .runner-card.tier-5 .badge { background: var(--tier-5-border); color: #fff; }

    .runner-card.tier-10 {
      background: var(--tier-10-bg);
      border: 2px solid var(--tier-10-border);
    }
    .runner-card.tier-10 .main-stat { color: var(--tier-10-text); }
    .runner-card.tier-10 .badge { background: var(--tier-10-border); color: #fff; }

    .runner-card.tier-15 {
      background: var(--tier-15-bg);
      border: 2px solid var(--tier-15-border);
    }
    .runner-card.tier-15 .main-stat { color: var(--tier-15-text); }
    .runner-card.tier-15 .badge { background: var(--tier-15-border); color: #fff; }

    .runner-card.tier-20 {
      background: var(--tier-20-bg);
      border: 2px solid var(--tier-20-border);
    }
    .runner-card.tier-20 .main-stat { color: var(--tier-20-text); }
    .runner-card.tier-20 .badge { background: var(--tier-20-border); color: #fff; }

    /* Superlative Highlight: Gold / Top Leaders */
    .runner-card.tier-gold {
      background: linear-gradient(180deg, #fffef2 0%, #fff9d6 100%) !important;
      border: 3px solid var(--gold) !important;
      box-shadow: 0 10px 30px rgba(212, 175, 55, 0.35) !important;
      outline: 2px solid rgba(255, 215, 0, 0.4);
    }
    .runner-card.tier-gold .main-stat { color: #8a6500 !important; }
    .runner-card.tier-gold .badge-gold {
      background: linear-gradient(90deg, #ffd700 0%, #ffae00 100%) !important;
      color: #111 !important;
      box-shadow: 0 3px 8px rgba(184, 134, 11, 0.4);
      font-weight: 900;
    }

    /* Superlative Highlight: Inception / Perfect Streak */
    .runner-card.tier-perfect {
      border: 3px solid #00897b !important;
      box-shadow: 0 10px 26px rgba(0, 137, 123, 0.28) !important;
    }
    .runner-card.tier-perfect .badge-perfect {
      background: #00897b !important;
      color: #fff !important;
      box-shadow: 0 3px 8px rgba(0, 137, 123, 0.3);
    }

    /* Badges */
    .badge {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 16px;
      font-size: 0.72rem;
      font-weight: 900;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      background: var(--tbs-charcoal);
      color: #fff;
    }

    .runner-name {
      font-weight: 900;
      font-size: 1.35rem;
      color: #1e293b;
      margin: 0 0 6px;
    }
    .main-stat {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--tbs-blue);
      line-height: 1.1;
      margin: 8px 0 4px;
    }
    .sub-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .lifetime-stat {
      font-size: 0.76rem;
      font-weight: 700;
      color: #8da4b6;
      margin-bottom: 14px;
    }
    .history-box {
      text-align: left;
      background: rgba(255, 255, 255, 0.75);
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
      font-size: 0.82rem;
      max-height: 140px;
      overflow-y: auto;
      flex-grow: 1;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .history-item {
      padding: 4px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      color: var(--tbs-charcoal);
    }
    .history-item:last-child { border-bottom: none; }
    .history-year {
      font-weight: 700;
      color: var(--tbs-blue-dark);
      display: inline-block;
      width: 44px;
    }

    /* Share Button */
    .share-btn {
      background: #ffffff;
      border: 1.5px solid #cbdde9;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--tbs-charcoal);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .share-btn:hover {
      background: #f0f7fd;
      border-color: var(--tbs-blue);
      color: var(--tbs-blue);
    }
    .share-icon { width: 14px; height: 14px; }

    /* Floating CTA */
    .floating-cta {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--tbs-blue);
      color: white;
      padding: 14px 24px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 900;
      z-index: 2000;
      border: 2px solid #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      box-shadow: 0 6px 18px rgba(1, 103, 180, 0.35);
      transition: transform 0.2s, background 0.2s;
    }
    .floating-cta:hover {
      background: var(--tbs-blue-dark);
      transform: scale(1.04);
    }

    #sentinel { height: 40px; width: 100%; }
  </style>
</head>
<body>

  <header class="header-nav">
    <a href="https://www.ticketsignup.io/w/TexasBridgeSeries" class="header-link">
      <img src="https://d368g9lw5ileu7.cloudfront.net/uploads/generic/genericImage-websiteLogo-241525-1731519877.2565-0.bNnowf.png" class="header-logo" alt="Bridge Series Logo">
      <span class="site-title">Texas Bridge Series Legacy</span>
    </a>
  </header>

  <section class="hero-banner">
    <h1>Legacy Runners</h1>
    <p>Honoring runners across the toughest bridges in Texas: Kemah 10K, Galveston 10K, and La Porte Half Marathon.</p>
  </section>

  <main class="container">
    <div class="toolbar">
      <input type="text" id="runnerSearch" placeholder="Search for a legend by name...">
      <div class="filter-group">
        <button class="filter-btn active" data-filter="Series">Texas Bridge Series</button>
        <button class="filter-btn" data-filter="Kemah">Toughest 10K Kemah</button>
        <button class="filter-btn" data-filter="Galveston">Toughest 10K Galveston</button>
        <button class="filter-btn" data-filter="LaPorte">La Porte By the Bay Half</button>
      </div>

      <div class="legend-bar">
        <span class="legend-item"><span class="legend-color" style="background:#ffd700; border: 1px solid #b8860b;"></span> Leader (Gold)</span>
        <span class="legend-item"><span class="legend-color" style="background:#00897b;"></span> Perfect Streak</span>
        <span class="legend-item"><span class="legend-color" style="background:#db2777;"></span> 20+ Years</span>
        <span class="legend-item"><span class="legend-color" style="background:#7c3aed;"></span> 15+ Years</span>
        <span class="legend-item"><span class="legend-color" style="background:#0284c7;"></span> 10+ Years</span>
        <span class="legend-item"><span class="legend-color" style="background:#059669;"></span> 5+ Years</span>
      </div>
    </div>

    <div id="runnerList"></div>
    <div id="sentinel"></div>
  </main>

  <a href="https://www.ticketsignup.io/w/TexasBridgeSeries" class="floating-cta" target="_blank">Register Now</a>

  <script>
    let rawRunnersMap = {};
    let allRunners = [];
    let filteredRunners = [];
    let currentFilter = 'Series';
    let searchTerm = '';
    let maxVal = 0;
    const batchSize = 50;

    const historicalPossible = {
      Series: 0,
      Kemah: 0,
      Galveston: 0,
      LaPorte: 0
    };

    const listElement = document.getElementById("runnerList");

    // Case-insensitive, robust event classifier
    function classifyEvent(rawEvent) {
      if (!rawEvent) return null;
      const str = rawEvent.toLowerCase().replace(/[^a-z0-9]/g, ' ');

      if (str.includes('kemah')) {
        return 'Kemah 10k';
      }
      if (str.includes('galveston') || str.includes('galv')) {
        return 'Galveston 10k';
      }
      if (str.includes('porte') || str.includes('laporte') || str.includes('la porte') || str.includes('hartman')) {
        return 'La Porte Half';
      }
      return null;
    }

    function createCardHTML(r) {
      let tClass = "", bText = "", bClass = "badge-standard";
      const totalPossible = historicalPossible[currentFilter] || 0;
      const isLeader = (r.cVal === maxVal && maxVal > 0);
      const isPerfect = (totalPossible > 0 && r.cVal === totalPossible);

      // Milestone Loyalty Tier Classification
      if (r.cVal >= 20) {
        tClass = "tier-20";
        bText = "20+ Year Legacy";
      } else if (r.cVal >= 15) {
        tClass = "tier-15";
        bText = "15+ Year Legacy";
      } else if (r.cVal >= 10) {
        tClass = "tier-10";
        bText = "10+ Year Veteran";
      } else if (r.cVal >= 5) {
        tClass = "tier-5";
        bText = "5+ Year Faithful";
      } else {
        bText = "Bridge Finisher";
      }

      // Inception / Perfect Streak Overrides
      if (isPerfect) {
        tClass += " tier-perfect";
        bClass = "badge-perfect";
        bText = "Perfect Record";
      }

      // Top Leader Overrides (Highest Precedence)
      if (isLeader) {
        tClass += " tier-gold";
        bClass = "badge-gold";
        bText = currentFilter === 'Series' ? "All-Time Series Leader" : `${currentFilter} Leader`;
        if (isPerfect) {
          bText += " (Perfect Record)";
        }
      }

      // Format clean history items without emojis
      let historyItems = [];
      if (currentFilter === 'Series') {
        historyItems = r.seriesYears.map(yr => 
          `<div class="history-item"><span class="history-year">${yr}</span> Full Series (Kemah, Galveston, La Porte)</div>`
        );
      } else {
        const targetKey = currentFilter === 'Kemah' ? 'Kemah 10k' : (currentFilter === 'Galveston' ? 'Galveston 10k' : 'La Porte Half');
        historyItems = r.raceEntries
          .filter(entry => entry.event === targetKey)
          .map(entry => `<div class="history-item"><span class="history-year">${entry.year}</span> ${entry.event} Finisher</div>`);
      }

      return `
        <div class="runner-card ${tClass}" id="runner-${r.displayName.replace(/[^a-zA-Z0-9]/g, '-')}">
          <div class="badge ${bClass}">${bText}</div>
          <div class="runner-name">${r.displayName}</div>
          <div class="main-stat">${r.cVal}</div>
          <div class="sub-label">${r.cLabel}</div>
          <div class="lifetime-stat">Lifetime Bridge Finishes: ${r.totalFinishes}</div>
          <div class="history-box">${historyItems.join('')}</div>
          <button class="share-btn" onclick="shareRunner('${r.displayName.replace(/'/g, "\\'")}')">
            <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            Share My Legacy
          </button>
        </div>
      `;
    }

    function processAndFilter() {
      filteredRunners = allRunners.map(r => {
        let val = 0;
        let label = "";

        if (currentFilter === 'Series') {
          val = r.seriesCount;
          label = val === 1 ? "Series Completed" : "Series Completed";
        } else if (currentFilter === 'Kemah') {
          val = r.kemahCount;
          label = val === 1 ? "Kemah Finish" : "Kemah Finishes";
        } else if (currentFilter === 'Galveston') {
          val = r.galvestonCount;
          label = val === 1 ? "Galveston Finish" : "Galveston Finishes";
        } else if (currentFilter === 'LaPorte') {
          val = r.laporteCount;
          label = val === 1 ? "La Porte Finish" : "La Porte Finishes";
        }

        return { ...r, cVal: val, cLabel: label };
      }).filter(r => r.displayName.toLowerCase().includes(searchTerm.toLowerCase()) && r.cVal > 0);

      filteredRunners.sort((a, b) => b.cVal - a.cVal || a.displayName.localeCompare(b.displayName));
      maxVal = filteredRunners.length > 0 ? filteredRunners[0].cVal : 0;

      renderList(true);
    }

    function renderList(reset = false) {
      if (reset) listElement.innerHTML = "";
      const start = listElement.children.length;
      const nextBatch = filteredRunners.slice(start, start + batchSize);

      if (reset && nextBatch.length === 0) {
        listElement.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: #64748b; font-size: 1.1rem; padding: 40px 0;">No matching runners found.</p>`;
        return;
      }

      const htmlString = nextBatch.map(r => createCardHTML(r)).join('');
      listElement.insertAdjacentHTML('beforeend', htmlString);
    }

    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && listElement.children.length < filteredRunners.length) {
        renderList();
      }
    }, { threshold: 0.1 });
    observer.observe(document.getElementById('sentinel'));

    let searchTimeout;
    document.getElementById("runnerSearch").addEventListener("input", function() {
      clearTimeout(searchTimeout);
      searchTerm = this.value.trim();
      searchTimeout = setTimeout(processAndFilter, 250);
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentFilter = this.getAttribute("data-filter");
        processAndFilter();
      });
    });

    function shareRunner(name) {
      const url = new URL(window.location.href);
      url.searchParams.set('runner', name);
      const shareTitle = "Texas Bridge Series Legacy";
      const shareText = `Check out ${name}'s race legacy in the Texas Bridge Series! View stats:`;

      if (navigator.share) {
        navigator.share({ title: shareTitle, text: shareText, url: url.toString() }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url.toString()).then(() => {
          alert(`Link to ${name}'s legacy card copied to clipboard!`);
        });
      }
    }

    Papa.parse("tbs_master_list.csv?v=" + new Date().getTime(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim().replace(/^\uFEFF/, ''),
      complete: function(results) {
        let runnersObj = {};
        let seriesYearsSet = new Set();
        let kemahYearsSet = new Set();
        let galvYearsSet = new Set();
        let laporteYearsSet = new Set();

        results.data.forEach(row => {
          const rawYear = (row['Year'] || "").trim();
          let fName = (row['First Name'] || "").trim();
          let lName = (row['Last Name'] || "").trim();
          const rawEvent = (row['Event'] || "").trim();

          const event = classifyEvent(rawEvent);
          const parsedYear = parseInt(rawYear);

          if (!parsedYear || isNaN(parsedYear) || !fName || !lName || !event) return;
          const year = parsedYear.toString();

          // Strip middle initials/periods (e.g. "Mark E." -> "Mark") to aggregate historical duplicates
          const cleanFirst = fName.replace(/\s+[a-zA-Z]\.?$/, '').trim();
          const key = `${cleanFirst.toLowerCase()} ${lName.toLowerCase()}`;
          const formattedName = `${cleanFirst.charAt(0).toUpperCase() + cleanFirst.slice(1).toLowerCase()} ${lName.charAt(0).toUpperCase() + lName.slice(1).toLowerCase()}`;

          if (!runnersObj[key]) {
            runnersObj[key] = {
              displayName: formattedName,
              eventsByYear: {},
              raceEntries: [],
              totalFinishes: 0
            };
          }

          if (!runnersObj[key].eventsByYear[year]) {
            runnersObj[key].eventsByYear[year] = new Set();
          }

          // Prevent duplicate finish increments if a runner appears in both on-site and virtual lists for the same event
          if (!runnersObj[key].eventsByYear[year].has(event)) {
            runnersObj[key].eventsByYear[year].add(event);
            runnersObj[key].raceEntries.push({ year: parsedYear, event: event });
            runnersObj[key].totalFinishes += 1;
          }

          if (event === 'Kemah 10k') kemahYearsSet.add(year);
          if (event === 'Galveston 10k') galvYearsSet.add(year);
          if (event === 'La Porte Half') laporteYearsSet.add(year);
        });

        // Compute total active series years across the history
        kemahYearsSet.forEach(yr => {
          if (galvYearsSet.has(yr) && laporteYearsSet.has(yr)) {
            seriesYearsSet.add(yr);
          }
        });

        historicalPossible.Series = seriesYearsSet.size;
        historicalPossible.Kemah = kemahYearsSet.size;
        historicalPossible.Galveston = galvYearsSet.size;
        historicalPossible.LaPorte = laporteYearsSet.size;

        allRunners = Object.values(runnersObj).map(r => {
          let seriesYears = [];
          let kemahCount = 0;
          let galvestonCount = 0;
          let laporteCount = 0;

          for (const [yr, events] of Object.entries(r.eventsByYear)) {
            if (events.has('Kemah 10k') && events.has('Galveston 10k') && events.has('La Porte Half')) {
              seriesYears.push(parseInt(yr));
            }
            if (events.has('Kemah 10k')) kemahCount++;
            if (events.has('Galveston 10k')) galvestonCount++;
            if (events.has('La Porte Half')) laporteCount++;
          }

          r.raceEntries.sort((a, b) => b.year - a.year);
          seriesYears.sort((a, b) => b - a);

          return {
            displayName: r.displayName,
            totalFinishes: r.totalFinishes,
            seriesCount: seriesYears.length,
            seriesYears: seriesYears,
            kemahCount: kemahCount,
            galvestonCount: galvestonCount,
            laporteCount: laporteCount,
            raceEntries: r.raceEntries
          };
        });

        const urlParams = new URLSearchParams(window.location.search);
        const rParam = urlParams.get('runner');
        if (rParam) {
          document.getElementById('runnerSearch').value = rParam;
          searchTerm = rParam;
        }

        processAndFilter();
      },
      error: function(err) {
        listElement.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: red;">Error loading legacy data.</p>`;
        console.error(err);
      }
    });
  </script>
</body>
